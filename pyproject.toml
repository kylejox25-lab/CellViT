[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cellvit"
version = "0.1.0"
description = "CellViT foundation model for six-channel Cell Painting images"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5,<2.6",
    "numpy>=1.24",
    "pyarrow>=14",
    "Pillow>=10",
    "mosaicml-streaming==0.13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
analysis = [
    "pandas>=2.2,<3",
    "matplotlib>=3.8,<4",
    "scikit-learn>=1.4,<2",
    "nbformat>=5,<6",
    "jupyterlab>=4,<5",
]

[project.scripts]
cellvit-convert = "cellvit.data.convert:main"
cellvit-check-loader = "cellvit.data.check_loader:main"
cellvit-train = "cellvit.train.mae:main"
cellvit-embed = "cellvit.infer:main"
cellvit-evaluate = "cellvit.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
